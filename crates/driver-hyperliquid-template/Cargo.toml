[package]
name = "driver-hyperliquid-template"
version = "0.1.0"
authors = ["Cow Protocol Developers <dev@cow.fi>"]
edition = "2021"
license = "GPL-3.0-or-later"

[[bin]]
name = "driver-hyperliquid-template"
path = "src/main.rs"

[dependencies]
axum = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
serde = { workspace = true }
solvers-dto = { path = "../solvers-dto" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "time"] }
tower = { workspace = true }
tower-http = { workspace = true, features = ["limit", "trace"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
web3 = { workspace = true, features = ["http"] }

[build-dependencies]
anyhow = { workspace = true }
vergen = { workspace = true, features = ["git", "gitcl"] }

[lints]
workspace = true