tx-gas-limit = "45000000"
disable-access-list-simulation = true

[[solver]]
name = "hypervault" # Arbitrary name given to this solver, must be unique
endpoint = "http://localhost:9001"
absolute-slippage = "40000000000000000" # Denominated in wei, optional
relative-slippage = "0.1" # Percentage in the [0, 1] range
account = "" # Known test private key

[submission]
gas-price-cap = "1000000000000"

[[submission.mempool]]
mempool = "public"

[liquidity]
base-tokens = [
    "0xADcb2f358Eae6492F61A5F87eb8893d09391d160", # ETH
]
