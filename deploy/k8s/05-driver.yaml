apiVersion: v1
kind: Service
metadata:
  name: driver-service
  namespace: cow-protocol
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      name: api
  selector:
    app: driver
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: driver
  namespace: cow-protocol
spec:
  replicas: 1
  selector:
    matchLabels:
      app: driver
  template:
    metadata:
      labels:
        app: driver
    spec:
      containers:
        - name: driver
          image: YOUR_REGISTRY/cow-protocol-driver:latest
          command: ["cargo", "run", "--bin", "driver", "--", "--config", "/config/driver.toml"]
          ports:
            - containerPort: 80
              name: api
          envFrom:
            - configMapRef:
                name: cow-protocol-config
          volumeMounts:
            - name: driver-config
              mountPath: /config
              readOnly: true
      volumes:
        - name: driver-config
          configMap:
            name: driver-config
