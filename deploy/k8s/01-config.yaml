apiVersion: v1
kind: ConfigMap
metadata:
  name: cow-protocol-config
  namespace: cow-protocol
data:
  # Environment configuration
  ENV: "production"
  CHAIN_ID: "1"

  # Database configuration
  POSTGRES_DB: "cow_protocol"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "changeme"

  # External Database URLs - IMPORTANT: Update with your actual database endpoints
  DB_WRITE_URL: "postgres://db-host:5432/cow_protocol?user=postgres&password=changeme"
  DB_READ_URL: "postgres://db-host:5432/cow_protocol?user=postgres&password=changeme"

  # Ethereum RPC URLs - IMPORTANT: Update with your actual RPC endpoint
  ETH_RPC_URL: "wss://mainnet.gateway.tenderly.co"
  NODE_URL: "wss://mainnet.gateway.tenderly.co"
  SIMULATION_NODE_URL: "wss://mainnet.gateway.tenderly.co"
  ETHRPC: "wss://mainnet.gateway.tenderly.co"

  # Solver account private key - IMPORTANT: Update with your actual key
  SOLVER_ACCOUNT: "0x2a871d0798f97d79848a013d4936a73bf4cc922c825d33c1cf7073dff6d409c6"

  # EthFlow contracts configuration
  ETHFLOW_CONTRACTS: "0x04501b9b1d52e67f6862d157e00d13419d2d6e95"
  ETHFLOW_INDEXING_START: ""

  # Orderbook configuration
  ACCOUNT_BALANCES_SIMULATION: "true"
  ACCOUNT_BALANCES_SIMULATOR: "Web3"
  EIP1271_SKIP_CREATION_VALIDATION: "true"
  ENABLE_EIP1271_ORDERS: "true"
  PRICE_ESTIMATORS: "None"
  PRICE_ESTIMATION_DRIVERS: "baseline|http://driver-service/baseline"
  NATIVE_PRICE_ESTIMATORS: "baseline|http://driver-service/baseline"
  DRIVERS: "baseline|http://driver-service/baseline"
  BIND_ADDRESS: "0.0.0.0:80"
  BASELINE_SOURCES: "None"
  RUST_BACKTRACE: "1"
  TOML_TRACE_ERROR: "1"

  # Autopilot configuration
  LOG_FILTER: "warn,autopilot=info,shared=info,shared::price_estimation=info"
  SETTLE_INTERVAL: "15s"
  GAS_ESTIMATORS: "Native,Web3"
  BLOCK_STREAM_POLL_INTERVAL: "1s"
  NATIVE_PRICE_CACHE_MAX_UPDATE_SIZE: "100"
  NATIVE_PRICE_CACHE_MAX_AGE: "20m"
  SOLVER_TIME_LIMIT: "5"
  SKIP_EVENT_SYNC: "true"
  ETHRPC_MAX_BATCH_SIZE: "20"

  # Driver and Solver configuration
  ADDR: "0.0.0.0:80"
  LOG: "solvers=trace,shared=trace"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: driver-config
  namespace: cow-protocol
data:
  driver.toml: |
    tx-gas-limit = "45000000"

    [[solver]]
    name = "baseline"
    endpoint = "http://baseline-service"
    absolute-slippage = "40000000000000000"
    relative-slippage = "0.1"
    account = "0x2a871d0798f97d79848a013d4936a73bf4cc922c825d33c1cf7073dff6d409c6"

    [submission]
    gas-price-cap = "1000000000000"

    [[submission.mempool]]
    mempool = "public"

    [liquidity]
    base-tokens = [
        "0xc02aaa39b223fe8d0a0e5c4f27ead9083c756cc2", # WETH
        "0x6B175474E89094C44Da98b954EedeAC495271d0F", # DAI
        "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48", # USDC
        "0xdAC17F958D2ee523a2206206994597C13D831ec7", # USDT
        "0xc00e94Cb662C3520282E6f5717214004A7f26888", # COMP
        "0x9f8F72aA9304c8B593d555F12eF6589cC3A579A2", # MKR
        "0x2260FAC5E5542a773Aa44fBCfeDf7C193bc2C599", # WBTC
        "0x6810e776880C02933D47DB1b9fc05908e5386b96", # GNO
    ]

    [[liquidity.uniswap-v2]]
    preset = "uniswap-v2"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: baseline-config
  namespace: cow-protocol
data:
  baseline.toml: |
    chain-id = "1"
    base-tokens = [
        "0xc02aaa39b223fe8d0a0e5c4f27ead9083c756cc2", # WETH
        "0x6B175474E89094C44Da98b954EedeAC495271d0F", # DAI
        "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48", # USDC
        "0xdAC17F958D2ee523a2206206994597C13D831ec7", # USDT
        "0xc00e94Cb662C3520282E6f5717214004A7f26888", # COMP
        "0x9f8F72aA9304c8B593d555F12eF6589cC3A579A2", # MKR
        "0x2260FAC5E5542a773Aa44fBCfeDf7C193bc2C599", # WBTC
        "0x6810e776880C02933D47DB1b9fc05908e5386b96", # GNO
    ]
    max-hops = 2
    max-partial-attempts = 5
    native-token-price-estimation-amount = "100000000000000000"
