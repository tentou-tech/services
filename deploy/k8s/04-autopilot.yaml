apiVersion: v1
kind: Service
metadata:
  name: autopilot-service
  namespace: cow-protocol
spec:
  type: ClusterIP
  ports:
    - port: 9589
      targetPort: 9589
      name: metrics
  selector:
    app: autopilot
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: autopilot
  namespace: cow-protocol
spec:
  replicas: 1
  selector:
    matchLabels:
      app: autopilot
  template:
    metadata:
      labels:
        app: autopilot
    spec:
      initContainers:
        - name: wait-for-orderbook
          image: busybox:1.35
          command:
            - 'sh'
            - '-c'
            - |
              echo "Waiting for orderbook service to accept connections on port 80..."
              until nc -z orderbook-service.cow-protocol.svc.cluster.local 80; do
                echo "Orderbook service not ready yet, waiting..."
                sleep 3
              done
              echo "Orderbook service is ready!"
      containers:
        - name: autopilot
          image: YOUR_REGISTRY/cow-protocol-autopilot:latest
          command: ["cargo", "run", "--bin", "autopilot"]
          ports:
            - containerPort: 9589
              name: metrics
          envFrom:
            - configMapRef:
                name: cow-protocol-config
          env:
            - name: DRIVERS
              value: "baseline|http://driver-service/baseline|$(SOLVER_ACCOUNT)"
